<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PropView 3D — Apartment &amp; Plot Layout Visualizer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8622c'/%3E%3Cpath d='M8 22V13l8-5 8 5v9h-5v-6h-6v6z' fill='white'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <button id="btn-sidebar" class="icon-btn" title="Show / hide the input panel" aria-label="Toggle input panel">☰</button>
      <div class="brand"><span class="logo">⌂</span>PropView <em>3D</em></div>
      <nav class="tabs" role="tablist">
        <button class="tab" data-mode="apartment" role="tab">Apartment</button>
        <button class="tab" data-mode="plots" role="tab">Plot layout</button>
      </nav>
      <div class="actions">
        <button id="btn-sample" class="ghost">Load sample</button>
        <label class="ghost file-btn">Import JSON<input type="file" id="file-import" accept=".json,application/json" hidden /></label>
        <button id="btn-export" class="ghost">Export JSON</button>
      </div>
    </header>

    <main id="layout" class="layout">
      <aside class="sidebar"><div id="form-root"></div></aside>
      <section class="stage">
        <div id="viewer" class="viewer"></div>
        <div id="overlay-top" class="overlay-top"></div>
        <div id="info-card" class="info-card"></div>
        <div id="bottom-panel" class="bottom-panel"></div>
        <div id="view-controls" class="view-controls"></div>
        <div id="hint" class="hint">Drag to rotate · Scroll to zoom · Right-drag to pan · Click to select</div>
        <div id="flow" class="flow hidden"></div>
        <div id="toast" class="toast hidden" role="status"></div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
